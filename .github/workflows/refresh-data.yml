name: Refresh stock data

on:
  schedule:
    # Daily at 02:00 UTC — well after the US close (21:00 UTC), so the
    # previous session has settled.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two workflows now write to data/ on a schedule. Without a concurrency
# group they can interleave and one will push onto a stale ref.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest prices
        env:
          # Free Tiingo API token — https://www.tiingo.com
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: node scripts/fetch-data.js

      # The gate that would have caught the June 2026 outage. A fetch script
      # exiting 0 is not evidence the data is good; this reads what actually
      # landed on disk. It also writes data/manifest.json, so it must run
      # before the commit step.
      - name: Verify data
        run: node scripts/verify-data.js

      # Replaying the goldens here means a bad data refresh cannot silently
      # change what the site reports.
      - name: Replay goldens
        run: node scripts/replay.mjs

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A second scheduled writer exists now, so never assume this job
          # still holds the tip it checked out.
          git pull --rebase --autostash origin main
          # Only the data files themselves — never a half-written *.tmp.
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Refresh stock data $(date -u +%Y-%m-%d)"
            git push
          fi
